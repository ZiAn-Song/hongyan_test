services:
  - type: web
    name: hongyan-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APPBUILDER_TOKEN
        sync: false
      - key: APPBUILDER_APP_ID
        sync: false
      - key: CORS_ORIGINS
        value: '["https://hongyan.pages.dev"]'
