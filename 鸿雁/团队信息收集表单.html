<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队信息收集表</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        header {
            background-color: rgb(156, 12, 19);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .form-container {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .required::after {
            content: " *";
            color: #e74c3c;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #4b6cb7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(75, 108, 183, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .team-members-container {
            border: 2px solid #e0e6ed;
            border-radius: 8px;
            padding: 16px;
            background-color: #f9fafc;
        }

        .member-input {
            display: flex;
            margin-bottom: 12px;
        }

        .member-input input {
            flex-grow: 1;
            margin-right: 10px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-add {
            background-color: #e74c3c;
            color: white;
        }

        .btn-add:hover {
            background-color: rgba(156, 12, 19, 1);
        }

        .btn-remove {
            background-color: #3498db;
            color: white;
            padding: 5px 12px;
            font-size: 14px;
        }

        .btn-remove:hover {
            background-color: #e74c3c;
        }

        .submit-btn {
            background-color: rgba(156, 12, 19, 1);
            color: white;
            font-size: 18px;
            padding: 16px 32px;
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            background: linear-gradient(to right, #3a56a4, #2a458a);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(75, 108, 183, 0.3);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .form-col {
            flex: 1 1 300px;
        }

        .instructions {
            background-color: #f8f9fa;
            border-left: 4px solid rgba(156, 12, 19, 1);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
        }

        .instructions h3 {
            margin-bottom: 8px;
            color: #2c3e50;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
            border-top: 1px solid #eaeaea;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .form-col {
                flex: 1 1 100%;
            }

            header {
                padding: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }
        }

        /* 自定义下拉箭头 */
        select {
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%23333" viewBox="0 0 256 256"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 45px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>团队信息收集表</h1>
            <p class="subtitle">请填写您的团队信息，所有带 * 的字段为必填项</p>
        </header>

        <div class="form-container">
            <div class="instructions">
                <h3>填写说明</h3>
                <p>请准确填写团队相关信息，所有信息将用于团队认证和后续联系。请确保负责人联系方式准确无误，以便我们能及时与您联系。</p>
            </div>

            <form id="teamForm">
                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="teamName" class="required">团队名称</label>
                            <input type="text" id="teamName" name="teamName" required placeholder="请输入团队名称">
                        </div>
                    </div>

                    <div class="form-col">
                        <div class="form-group">
                            <label for="leaderName" class="required">负责人姓名</label>
                            <input type="text" id="leaderName" name="leaderName" required placeholder="请输入负责人姓名">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="studentId" class="required">负责人学号</label>
                            <input type="text" id="studentId" name="studentId" required placeholder="请输入负责人学号">
                        </div>
                    </div>

                    <div class="form-col">
                        <div class="form-group">
                            <label for="university" class="required">高校名称</label>
                            <input type="text" id="university" name="university" required placeholder="请输入所在高校名称">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="leaderContact" class="required">负责人联系方式</label>
                            <input type="tel" id="leaderContact" name="leaderContact" required placeholder="请输入手机号码">
                        </div>
                    </div>

                    <div class="form-col">
                        <div class="form-group">
                            <label for="leaderEmail">负责人邮箱</label>
                            <input type="email" id="leaderEmail" name="leaderEmail" placeholder="请输入邮箱地址（可选）">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-col">
                        <div class="form-group">
                            <label for="teacherName">指导老师姓名</label>
                            <input type="text" id="teacherName" name="teacherName" placeholder="请输入指导老师姓名（可选）">
                        </div>
                    </div>

                    <div class="form-col">
                        <div class="form-group">
                            <label for="teacherContact">指导老师联系方式</label>
                            <input type="text" id="teacherContact" name="teacherContact" placeholder="请输入指导老师联系方式（可选）">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="teamSpecialty" class="required">团队专业领域</label>
                    <select id="teamSpecialty" name="teamSpecialty" required>
                        <option value="" disabled selected>请选择团队专业领域</option>
                        <option value="医疗健康">医疗健康</option>
                        <option value="基础建设">基础建设</option>
                        <option value="教育民生">教育民生</option>
                        <option value="基层治理">基层治理</option>
                        <option value="文旅">文旅</option>
                        <option value="环境">环境</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="teamMembers" class="required">团队成员姓名</label>
                    <div class="team-members-container">
                        <div class="member-input" id="memberInputTemplate">
                            <input type="text" class="member-name" placeholder="请输入成员姓名">
                            <button type="button" class="btn btn-remove remove-member">删除</button>
                        </div>
                        <!-- 初始成员输入框 -->
                        <div class="member-input">
                            <input type="text" class="member-name" placeholder="请输入成员姓名" required>
                            <button type="button" class="btn btn-remove remove-member">删除</button>
                        </div>
                        <div class="member-input">
                            <input type="text" class="member-name" placeholder="请输入成员姓名" required>
                            <button type="button" class="btn btn-remove remove-member">删除</button>
                        </div>
                        <button type="button" class="btn btn-add" id="addMember">添加成员</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="teamDescription" class="required">团队简述</label>
                    <textarea id="teamDescription" name="teamDescription" required
                        placeholder="请简要描述团队的研究方向、目标或特色（不少于50字）"></textarea>
                </div>

                <button type="submit" class="btn submit-btn">提交团队信息</button>
            </form>
        </div>

        <footer>
            <p>© 2023 团队信息收集系统 | 本表单收集的信息仅用于内部管理</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 获取成员输入框模板
            const memberTemplate = document.getElementById('memberInputTemplate');
            memberTemplate.style.display = 'none';

            // 添加成员按钮事件
            document.getElementById('addMember').addEventListener('click', function () {
                const newMemberInput = memberTemplate.cloneNode(true);
                newMemberInput.style.display = 'flex';
                const input = newMemberInput.querySelector('.member-name');
                input.value = '';
                input.required = true;

                // 插入到添加按钮之前
                this.parentNode.insertBefore(newMemberInput, this);

                // 添加删除事件
                newMemberInput.querySelector('.remove-member').addEventListener('click', function () {
                    this.parentNode.remove();
                });
            });

            // 为初始的删除按钮添加事件
            document.querySelectorAll('.remove-member').forEach(button => {
                button.addEventListener('click', function () {
                    // 至少保留一个成员输入框
                    const memberInputs = document.querySelectorAll('.member-input');
                    if (memberInputs.length > 2) { // 包括模板
                        this.parentNode.remove();
                    } else {
                        alert('团队至少需要一名成员');
                    }
                });
            });

            // 表单提交事件
            document.getElementById('teamForm').addEventListener('submit', function (e) {
                e.preventDefault();
                // 验证表单
                if (!validateForm()) {
                    return;
                }
                // 收集所有成员姓名
                const memberNames = [];
                document.querySelectorAll('.member-name').forEach(input => {
                    if (input.value.trim() !== '') {
                        memberNames.push(input.value.trim());
                    }
                });
                // 收集表单数据
                const formData = {
                    teamName: document.getElementById('teamName').value,
                    leaderName: document.getElementById('leaderName').value,
                    studentId: document.getElementById('studentId').value,
                    university: document.getElementById('university').value,
                    leaderContact: document.getElementById('leaderContact').value,
                    leaderEmail: document.getElementById('leaderEmail').value,
                    teacherName: document.getElementById('teacherName').value,
                    teacherContact: document.getElementById('teacherContact').value,
                    teamSpecialty: document.getElementById('teamSpecialty').value,
                    teamDescription: document.getElementById('teamDescription').value,
                    memberNames: memberNames
                };

                var teamMsg = [];
                axios
                    .post("http://127.0.0.1:5000/api/read", {
                        filename: "Team_Announcement",
                    })
                    .then(function (response) {
                        teamMsg = response.data.data.TEAM;
                        teamMsg.push(formData);
                        const requestMsg = {
                            filename: "Team_Announcement",
                            content: {
                                TEAM: teamMsg,
                            },
                        };
                        axios
                            .post("http://127.0.0.1:5000/api/write", requestMsg)
                            .then(function (response) {
                                showSuccessMessage();
                            })
                            .catch(function (error) {
                                console.error("请求失败", error);
                            });

                    })
                    .catch(function (error) {
                        console.error("请求失败", error);
                    });

                // 在实际应用中，这里会将数据发送到服务器
                // 现在只显示成功消息

            });

            // 表单验证函数
            function validateForm() {
                const teamName = document.getElementById('teamName').value.trim();
                const leaderName = document.getElementById('leaderName').value.trim();
                const studentId = document.getElementById('studentId').value.trim();
                const university = document.getElementById('university').value.trim();
                const leaderContact = document.getElementById('leaderContact').value.trim();
                const teamSpecialty = document.getElementById('teamSpecialty').value;
                const teamDescription = document.getElementById('teamDescription').value.trim();

                // 检查必填字段
                if (!teamName || !leaderName || !studentId || !university || !leaderContact || !teamSpecialty || !teamDescription) {
                    alert('请填写所有必填字段（带 * 的字段）');
                    return false;
                }
                // 检查团队简述长度
                if (teamDescription.length < 50) {
                    alert('团队简述不能少于50字');
                    return false;
                }

                // 检查成员数量
                const memberNames = [];
                document.querySelectorAll('.member-name').forEach(input => {
                    if (input.value.trim() !== '') {
                        memberNames.push(input.value.trim());
                    }
                });

                if (memberNames.length === 0) {
                    alert('请至少添加一名团队成员');
                    return false;
                }

                return true;
            }

            // 显示成功消息
            function showSuccessMessage() {
                // 创建成功消息弹窗
                const modal = document.createElement('div');
                modal.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background-color: rgba(0,0,0,0.7);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 1000;
                `;

                const modalContent = document.createElement('div');
                modalContent.style.cssText = `
                    background-color: white;
                    padding: 40px;
                    border-radius: 12px;
                    text-align: center;
                    max-width: 500px;
                    width: 90%;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                `;

                modalContent.innerHTML = `
                    <h2 style="color: #27ae60; margin-bottom: 20px;">提交成功！</h2>
                    <p style="margin-bottom: 25px; font-size: 16px; line-height: 1.6;">您的团队信息已成功提交，我们将在3个工作日内进行审核。审核结果将通过您提供的联系方式通知。</p >
                    <button id="closeModal" style="background-color: #4b6cb7; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background-color 0.3s;">确定</button>
                `;

                modal.appendChild(modalContent);
                document.body.appendChild(modal);

                // 关闭弹窗事件
                document.getElementById('closeModal').addEventListener('click', function () {
                    document.body.removeChild(modal);
                    // 在实际应用中，这里可能会重定向或重置表单
                    // document.getElementById('teamForm').reset();
                });
            }

            // 设置表单示例数据（仅用于演示）


            function setSampleData() {
                // 在实际应用中不应设置示例数据，这里仅用于演示
                document.getElementById('teamName').value = '创新科技研究小组';
                document.getElementById('leaderName').value = '张明';
                document.getElementById('studentId').value = '202301001';
                document.getElementById('university').value = '北京大学';
                document.getElementById('leaderContact').value = '13800138000';
                document.getElementById('leaderEmail').value = 'zhangming@example.com';
                document.getElementById('teacherName').value = '李教授';
                document.getElementById('teacherContact').value = '13900139000';
                document.getElementById('teamSpecialty').value = '医疗健康';
                document.getElementById('teamDescription').value = '我们团队专注于医疗健康领域的研究，特别是智能医疗设备的开发与应用。团队成员来自计算机科学、医学和工程学等多个专业背景，具备跨学科合作的能力。我们的目标是利用技术创新解决医疗健康领域的实际问题，提高医疗服务的效率和质量。目前，我们正在开发一款基于人工智能的早期疾病筛查系统，希望能为公共健康事业做出贡献。';

                // 设置团队成员
                const memberInputs = document.querySelectorAll('.member-name');
                const sampleMembers = ['张明', '王芳', '李雷'];

                memberInputs.forEach((input, index) => {
                    if (index < sampleMembers.length) {
                        input.value = sampleMembers[index];
                    }
                });
            }
        });
    </script>
</body>

</html>
```
