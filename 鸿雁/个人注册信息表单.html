<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人信息收集表</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #333;
      line-height: 1.6;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1600px;
      background-color: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    header {
      background-color: rgb(156, 12, 19);
      color: white;
      padding: 30px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.9;
      font-weight: 300;
    }

    .form-container {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #2c3e50;
      font-size: 1.05rem;
    }

    .required::after {
      content: " *";
      color: #ef4444;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="password"],
    select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
      background-color: #f8fafc;
    }

    input:focus,
    select:focus {
      border-color: rgba(59, 130, 246, 0.8);
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background-color: white;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 8px;
    }

    .radio-option {
      display: flex;
      align-items: center;
    }

    .radio-option input {
      margin-right: 8px;
      width: 18px;
      height: 18px;
      accent-color: #3b82f6;
    }

    .radio-option label {
      margin-bottom: 0;
      font-weight: normal;
      cursor: pointer;
    }

    .password-container {
      position: relative;
    }

    .invisible,
    .visible {
      position: absolute;
      right: 10px;
      top: 70%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
    }

    .btn {
      padding: 16px 32px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .submit-btn {
      background-color: rgba(156, 12, 19, 1);
      color: white;
      font-size: 18px;
      padding: 18px;
      border-radius: 10px;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .submit-btn:hover {
      background: linear-gradient(to right,
          rgba(37, 99, 235, 0.9),
          rgba(30, 64, 175, 0.9));
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.25);
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .form-col {
      flex: 1;
      min-width: 200px;
    }

    .instructions {
      background-color: rgba(239, 246, 255, 0.6);
      border-left: 4px solid rgba(156, 12, 19, 1);
      padding: 16px;
      margin-bottom: 25px;
      border-radius: 0 10px 10px 0;
    }

    .instructions h3 {
      margin-bottom: 8px;
      color: #3b82f6;
      display: flex;
      align-items: center;
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 0.9rem;
      border-top: 1px solid #eaeaea;
      margin-top: 20px;
      background-color: #f9f9f9;
    }

    @media (max-width: 640px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }

      .form-col {
        flex: 1 1 100%;
      }

      header {
        padding: 25px 20px;
      }

      h1 {
        font-size: 1.7rem;
      }

      .form-container {
        padding: 25px;
      }

      body {
        padding: 15px;
      }
    }

    /* 自定义下拉箭头 */
    select {
      appearance: none;
      background-image: url('data:image/svg+xml;charset=US-ASCII,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%23333" viewBox="0 0 256 256"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 16px center;
      background-size: 16px;
      padding-right: 45px;
    }

    .success-message {
      background-color: #d1fae5;
      color: #065f46;
      padding: 16px;
      border-radius: 10px;
      margin-top: 20px;
      display: none;
      border-left: 4px solid #10b981;
    }

    .success-message.show {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  <!-- 引入图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-user-circle"></i> 个人信息收集表</h1>
      <p class="subtitle">请准确填写您的个人信息，所有带 * 的字段为必填项</p>
    </header>

    <div class="form-container">
      <div class="instructions">
        <h3><i class="fas fa-info-circle"></i> 填写说明</h3>
        <p>
          请确保您填写的信息真实有效，这些信息将用于身份验证和相关联系。我们承诺保护您的个人隐私。
        </p>
      </div>

      <form id="personalInfoForm">
        <div class="form-group">
          <label for="fullName" class="required">个人姓名</label>
          <input type="text" id="fullName" name="fullName" required placeholder="请输入您的真实姓名" />
        </div>

        <div class="form-group password-container">
          <label for="password" class="required">密码</label>
          <input type="password" id="password" name="password" required placeholder="请输入您的密码" />
          <img id="passwordeye" class="invisible" src="./img/invisible.png" alt="Smiley face" width="20" height="20"
            onclick="switchPwd()" />
        </div>
        <div class="form-group">
          <label for="gender" class="required">性别</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="male" name="gender" value="男" required />
              <label for="male">男</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="female" name="gender" value="女" />
              <label for="female">女</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="other" name="gender" value="其他" />
              <label for="other">其他</label>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <div class="form-group">
              <label for="university" class="required">所属高校名称</label>
              <input type="text" id="university" name="university" required placeholder="请输入您所在的高校名称" />
            </div>
          </div>

          <div class="form-col">
            <div class="form-group">
              <label for="studentId" class="required">学号</label>
              <input type="text" id="studentId" name="studentId" required placeholder="请输入您的学号" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="contact" class="required">联系方式</label>
          <input type="tel" id="contact" name="contact" required placeholder="请输入您的手机号码" />
        </div>

        <div class="form-group">
          <label for="email">电子邮箱（可选）</label>
          <input type="email" id="email" name="email" placeholder="请输入您的邮箱地址" />
        </div>

        <div class="form-group">
          <label for="major">专业（可选）</label>
          <input type="text" id="major" name="major" placeholder="请输入您的专业" />
        </div>

        <button type="submit" class="btn submit-btn">
          <i class="fas fa-check-circle"></i> 提交信息
        </button>

        <div class="success-message" id="successMessage">
          <p><i class="fas fa-check"></i> 个人信息提交成功！</p>
        </div>
      </form>
    </div>

    <footer>
      <p>
        <i class="fas fa-lock"></i>
        隐私保护：我们承诺严格遵守个人信息保护相关法律法规
      </p>
      <p style="margin-top: 8px">
        © 2026 个人信息收集系统 | 仅用于信息登记与核实
      </p>
    </footer>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 表单提交事件
      document
        .getElementById("personalInfoForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // 验证表单
          if (!validateForm()) {
            return;
          }


          const gender = document.getElementsByName('gender');
          let genderValue = '';
          for (let i = 0; i < gender.length; i++) {
            if (gender[i].checked) {
              genderValue = gender[i].value;
              break;
            }
          }

          // 收集表单数据
          const formData = {
            studentId: document.getElementById("studentId").value,
            password: document.getElementById("password").value,
            fullName: document.getElementById("fullName").value,
            gender: genderValue,
            university: document.getElementById("university").value,
            contact: document.getElementById("contact").value,
            email: document.getElementById("email").value,
            major: document.getElementById("major").value,
          };

          var stbMsg = [];
          axios
            .post("http://127.0.0.1:5000/api/read", {
              filename: "Personal_Information",
            })
            .then(function (response) {
              stbMsg = response.data.data.users;
              if (
                stbMsg.length > 0 &&
                stbMsg.find((item) => item.studentId === formData.studentId)
              ) {
                alert("学号已存在");
                return;
              } else {
                stbMsg.push(formData);

                const requestMsg = {
                  filename: "Personal_Information",
                  content: {
                    users: stbMsg,
                  },
                };
                axios
                  .post("hhttp://127.0.0.1:5000/api/write", requestMsg)
                  .then(function (response) {
                    showSuccessMessage(formData);
                  })
                  .catch(function (error) {
                    console.error("请求失败", error);
                  });
              }
            })
            .catch(function (error) {
              console.error("请求失败", error);
            });

          // // 在实际应用中，这里会将数据发送到服务器
          // // 现在只显示成功消息
          // showSuccessMessage(formData);
        });

      // 手机号码验证
      document
        .getElementById("contact")
        .addEventListener("blur", function () {
          const phone = this.value.trim();
          if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
            alert("请输入有效的手机号码");
          }
        });

      // 学号验证（简单验证）
      document
        .getElementById("studentId")
        .addEventListener("blur", function () {
          const studentId = this.value.trim();
          if (studentId && studentId.length < 5) {
            alert("学号长度不足，请检查");
          }
        });

      // 表单验证函数
      function validateForm() {
        const fullName = document.getElementById("fullName").value.trim();
        const password = document.getElementById("password").value.trim();
        const gender = document.querySelector('input[name="gender"]:checked');
        const university = document.getElementById("university").value.trim();
        const studentId = document.getElementById("studentId").value.trim();
        const contact = document.getElementById("contact").value.trim();

        // 检查必填字段
        if (
          !fullName ||
          !gender ||
          !university ||
          !studentId ||
          !contact ||
          !password
        ) {
          alert("请填写所有必填字段（带 * 的字段）");
          return false;
        }

        // 检查姓名长度
        if (fullName.length < 2) {
          alert("请输入有效的姓名");
          document.getElementById("fullName").focus();
          return false;
        }

        // 检查密码长度
        if (password.length < 6) {
          alert("请输入长度至少为6位的密码");
          document.getElementById("password").focus();
          return false;
        }

        // 检查手机号码格式
        if (!/^1[3-9]\d{9}$/.test(contact)) {
          alert("请输入有效的手机号码（11位数字）");
          document.getElementById("contact").focus();
          return false;
        }

        // 检查学号长度
        if (studentId.length < 5) {
          alert("学号长度不足，请检查");
          document.getElementById("studentId").focus();
          return false;
        }

        return true;
      }

      // 显示成功消息
      function showSuccessMessage(formData) {
        const successMessage = document.getElementById("successMessage");

        // 更新成功消息内容
        const name = document.getElementById("fullName").value;
        const university = document.getElementById("university").value;

        successMessage.innerHTML = `
                    <p style="margin-bottom: 10px;"><i class="fas fa-check"></i> 个人信息提交成功！</p >
                    <p style="font-size: 14px; margin-bottom: 5px;"><strong>姓名：</strong>${name}</p >
                    <p style="font-size: 14px; margin-bottom: 5px;"><strong>高校：</strong>${university}</p >
                    <p style="font-size: 14px; margin-bottom: 5px;"><strong>提交时间：</strong>${new Date().toLocaleString()}</p >
                    <p style="font-size: 14px; margin-top: 10px; color: #047857;">您的信息已成功保存，感谢您的填写！</p >
                `;

        // 显示成功消息
        successMessage.classList.add("show");

        // 3秒后可以重置表单
        setTimeout(() => {
          // 在实际应用中，这里可能是重定向或保持表单状态
          // 现在只提供重置选项
          if (confirm("信息提交成功！是否要填写另一份信息？")) {
            document.getElementById("personalInfoForm").reset();
            successMessage.classList.remove("show");
          }
        }, 3000);

        // 滚动到成功消息
        successMessage.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
        });
      }

      // 设置表单示例数据（仅用于演示）

      function setSampleData() {
        // 在实际应用中不应设置示例数据，这里仅用于演示
        document.getElementById("fullName").value = "张明";
        document.getElementById("male").checked = true;
        document.getElementById("university").value = "北京大学";
        document.getElementById("studentId").value = "202301001";
        document.getElementById("contact").value = "13800138000";
        document.getElementById("email").value = "zhangming@example.com";
        document.getElementById("major").value = "计算机科学与技术";
      }
    });
    function switchPwd() {
      var passwordeye = document.getElementById("passwordeye");
      var showPwd = document.getElementById("password");
      var src = passwordeye.getAttribute("src");
      if (src == "./img/invisible.png") {
        passwordeye.src = "./img/visible.png";
        showPwd.type = "text";
      } else {
        passwordeye.src = "./img/invisible.png";
        showPwd.type = "password";
      }
    }
  </script>
</body>

</html>
```
