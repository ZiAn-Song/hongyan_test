<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础建设 - 实践项目</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f5f9ff;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1a6dcc 0%, #0d4a9c 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(26, 109, 204, 0.25);
            text-align: center;
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
        }

        .job-listings {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .job-card {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-left: 6px solid #1a6dcc;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .job-title {
            color: #1a6dcc;
            font-size: 1.8rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .job-title::before {
            content: "🏗️";
            font-size: 1.5rem;
        }

        .job-location-salary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eaeaea;
        }

        .location {
            font-size: 1.1rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location::before {
            content: "📍";
        }

        .salary {
            font-size: 1.4rem;
            color: #e63946;
            font-weight: bold;
        }

        .requirements {
            display: flex;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .requirement-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            color: #666;
        }

        .requirement-item::before {
            content: "•";
            color: #1a6dcc;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .company-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px dashed #ddd;
        }

        .company-details {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .company-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #1a6dcc;
        }

        .company-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .company-tag {
            background-color: #e6f0ff;
            color: #1a6dcc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .apply-btn {
            background: linear-gradient(135deg, #1a6dcc 0%, #0d4a9c 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(26, 109, 204, 0.3);
            transition: transform 0.2s;
        }

        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(26, 109, 204, 0.4);
        }

        .divider {
            height: 2px;
            background: linear-gradient(to right, transparent, #1a6dcc, transparent);
            margin: 30px 0;
            border: none;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #d9e7ff;
            color: #666;
            font-size: 0.9rem;
        }

        .job-description {
            margin-bottom: 25px;
            color: #555;
            line-height: 1.7;
        }

        /* 加载状态样式 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a6dcc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e63946;
            background-color: #ffe6e6;
            border-radius: 10px;
            margin: 20px 0;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }

        /* 状态标签 */
        .status-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-new {
            background-color: #e6f0ff;
            color: #1a6dcc;
        }

        /* 分页样式 */
        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }

        .pagination {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .page-btn {
            padding: 8px 16px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            min-width: 40px;
            text-align: center;
        }

        .page-btn:hover:not(.disabled) {
            background-color: #f5f5f5;
            border-color: #1a6dcc;
            color: #1a6dcc;
        }

        .page-btn.active {
            background-color: #1a6dcc;
            color: white;
            border-color: #1a6dcc;
        }

        .page-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-info {
            color: #666;
            font-size: 0.9rem;
            margin: 0 15px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2rem;
                flex-direction: column;
                gap: 10px;
            }

            .job-location-salary {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .requirements {
                flex-direction: column;
                gap: 10px;
            }

            .company-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .apply-btn {
                align-self: stretch;
                text-align: center;
            }

            .pagination {
                flex-wrap: wrap;
                justify-content: center;
            }

            .page-info {
                order: -1;
                width: 100%;
                text-align: center;
                margin-bottom: 10px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <h1><i class="fas fa-hard-hat"></i> 基础建设实践项目 <i class="fas fa-tools"></i></h1>
        <p>浏览基础设施建设、城市规划、交通工程等领域发布的实践需求，寻找适合您的项目机会</p>
    </header>

    <!-- 加载状态 -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>正在加载基础建设项目数据...</p>
    </div>

    <!-- 错误显示 -->
    <div id="error" class="error" style="display: none;">
        <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 15px;"></i>
        <p id="error-message">数据加载失败，请稍后重试</p>
        <button onclick="loadData()" style="margin-top: 15px; padding: 8px 20px; background: #1a6dcc; color: white; border: none; border-radius: 5px; cursor: pointer;">
            重新加载
        </button>
    </div>

    <!-- 无数据提示 -->
    <div id="no-data" class="no-data" style="display: none;">
        <i class="fas fa-clipboard-list" style="font-size: 3rem; margin-bottom: 15px; color: #ddd;"></i>
        <h3>暂无基础建设相关项目</h3>
        <p>当前没有机构发布基础建设领域的实践需求</p>
    </div>

    <!-- 项目列表容器 -->
    <main class="job-listings" id="project-listings" style="display: none;">
        <!-- 动态生成项目卡片 -->
    </main>

    <!-- 分页容器 -->
    <div id="pagination-container" class="pagination-container" style="display: none;">
        <div class="pagination">
            <button class="page-btn prev-btn" onclick="changePage(currentPage - 1)">
                <i class="fas fa-chevron-left"></i>
            </button>
            <span class="page-info">第 <span id="current-page">1</span> 页 / 共 <span id="total-pages">1</span> 页</span>
            <button class="page-btn next-btn" onclick="changePage(currentPage + 1)">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <footer class="footer">
        <p>山东大学实践服务平台 - 基础建设领域</p>
        <p style="margin-top: 10px; font-size: 0.85rem;">数据来源于政企机构提交的实践需求，实时更新</p>
    </footer>

    <script>
        // 全局变量
        let allProjects = [];
        let currentPage = 1;
        const itemsPerPage = 4; // 每页固定显示4个项目

        document.addEventListener('DOMContentLoaded', loadData);

        async function loadData() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const noDataEl = document.getElementById('no-data');
            const listingsEl = document.getElementById('project-listings');
            const paginationContainer = document.getElementById('pagination-container');

            loadingEl.style.display = 'block';
            errorEl.style.display = 'none';
            noDataEl.style.display = 'none';
            listingsEl.style.display = 'none';
            paginationContainer.style.display = 'none';

            try {
                const response = await fetch('http://127.0.0.1:5000/api/read', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        filename: "Corporate_Announcement"
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const result = await response.json();
                const demands = result.data.Demand || [];

                // 过滤基础建设相关项目
                allProjects = demands.filter(item => {
                    const targetMajor = item.Target_Major || [];
                    return targetMajor.includes("基础建设") ||
                           (typeof targetMajor === 'string' && targetMajor === "基础建设");
                });

                loadingEl.style.display = 'none';

                if (allProjects.length === 0) {
                    noDataEl.style.display = 'block';
                    return;
                }

                // 渲染项目和分页
                renderPage();

            } catch (error) {
                console.error('加载数据失败:', error);
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                document.getElementById('error-message').textContent = `数据加载失败: ${error.message}`;
            }
        }

        function renderPage() {
            const listingsEl = document.getElementById('project-listings');
            const paginationContainer = document.getElementById('pagination-container');

            listingsEl.innerHTML = '';
            listingsEl.style.display = 'flex';

            // 计算总页数
            const totalPages = Math.ceil(allProjects.length / itemsPerPage);

            // 计算当前页的项目
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(currentPage * itemsPerPage, allProjects.length);
            const displayProjects = allProjects.slice(startIndex, endIndex);

            // 渲染当前页的项目
            displayProjects.forEach((project, index) => {
                const companyName = project.Company_Name || project.orgName || '未知机构';
                const location = project.Internship_Location || project.practiceLocation || '地点待定';
                const estimatedTime = project.Estimated_Time || project.practiceDuration || '时间待定';
                const requirements = project.Requirements_Content || project.recruitmentNeeds || '暂无详细需求';
                const orgType = project.orgType || '机构';

                const card = document.createElement('article');
                card.className = 'job-card';
                card.innerHTML = `
                    <h2 class="job-title">
                        ${companyName}
                        <span class="status-tag status-new">基础建设</span>
                    </h2>

                    <div class="job-location-salary">
                        <div class="location">${location}</div>
                        <div class="salary">${estimatedTime}</div>
                    </div>

                    <div class="requirements">
                        <div class="requirement-item">${orgType}</div>
                        <div class="requirement-item">${estimatedTime}</div>
                        <div class="requirement-item">土木工程/城市规划相关专业</div>
                    </div>

                    <div class="job-description">
                        <p>${requirements.substring(0, 200)}${requirements.length > 200 ? '...' : ''}</p>
                    </div>

                    <div class="company-info">
                        <div class="company-details">
                            <span class="company-name">${companyName}</span>
                            <div class="company-tags">
                                <span class="company-tag">基础建设</span>
                                <span class="company-tag">${orgType}</span>
                                <span class="company-tag">社会实践</span>
                            </div>
                        </div>
                        <button class="apply-btn" onclick="applyForProject('${companyName}')">报名加入</button>
                    </div>
                `;

                listingsEl.appendChild(card);

                // 添加分隔线
                if (index < displayProjects.length - 1) {
                    const divider = document.createElement('hr');
                    divider.className = 'divider';
                    listingsEl.appendChild(divider);
                }
            });

            // 更新分页信息
            updatePagination(totalPages);
        }

        function updatePagination(totalPages) {
            const paginationContainer = document.getElementById('pagination-container');
            const currentPageEl = document.getElementById('current-page');
            const totalPagesEl = document.getElementById('total-pages');
            const prevBtn = document.querySelector('.prev-btn');
            const nextBtn = document.querySelector('.next-btn');

            // 更新页码信息
            currentPageEl.textContent = currentPage;
            totalPagesEl.textContent = totalPages;

            // 更新按钮状态
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;

            if (prevBtn.disabled) {
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.classList.remove('disabled');
            }

            if (nextBtn.disabled) {
                nextBtn.classList.add('disabled');
            } else {
                nextBtn.classList.remove('disabled');
            }

            // 显示或隐藏分页容器
            if (totalPages > 1) {
                paginationContainer.style.display = 'flex';
            } else {
                paginationContainer.style.display = 'none';
            }
        }

        function changePage(page) {
            const totalPages = Math.ceil(allProjects.length / itemsPerPage);

            if (page < 1 || page > totalPages) {
                return;
            }

            currentPage = page;
            renderPage();

            // 滚动到顶部
            window.scrollTo({
                top: document.querySelector('.header').offsetTop,
                behavior: 'smooth'
            });
        }

        function applyForProject(companyName) {
            alert(`您已申请加入 "${companyName}" 的基础建设项目\n\n平台管理员会尽快与您联系！`);
        }
    </script>
</body>
</html>
